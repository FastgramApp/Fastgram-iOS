blank_issues_enabled: false
contact_links:
  - name: 🔒 Security vulnerability
    url: https://github.com/FastgramApp/Fastgram-iOS/security/advisories/new
    about: Report privately — please do not open a public issue.
  - name: 🛠 Build problems
    url: https://github.com/FastgramApp/Fastgram-iOS/blob/master/docs/BUILDING.md
    about: Read the build guide first; it covers the common failures.
  - name: 💬 Bug in Telegram itself
    url: https://bugs.telegram.org
    about: If it reproduces in the official Telegram app, report it to Telegram.
